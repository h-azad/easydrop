services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  signaling:
    build:
      context: .
      dockerfile: apps/signaling-server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-http://localhost:3000}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    ports:
      - "4000:4000"
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SIGNALING_URL: "${NEXT_PUBLIC_SIGNALING_URL:-http://localhost:4000}"
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SIGNALING_URL: "${NEXT_PUBLIC_SIGNALING_URL:-http://localhost:4000}"
    ports:
      - "3000:3000"
    depends_on:
      - signaling

volumes:
  redis-data:
